name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # cargo llvm-cov runs `cargo test` (unit and integration tests) with
      # coverage instrumentation, so the tests only build and run once.
      - name: Test with coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov report --summary-only

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

  # Dogfooding: calculate this repository's version with versinc built from
  # the same commit, so CI never depends on a previously released binary.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versinc.outputs.version }}
      previous: ${{ steps.versinc.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versinc needs the full history and tags

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Calculate version with versinc
        id: versinc
        run: |
          cargo run --release --locked --quiet -- --format json > versinc.json
          cat versinc.json
          version=$(jq -r .next_version versinc.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$(jq -r '.previous_version // ""' versinc.json)" >> "$GITHUB_OUTPUT"
          echo "::notice title=versinc::Calculated version $version"
          {
            echo "### versinc: \`$version\`"
            echo
            echo '```json'
            cat versinc.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # SonarQube Community Build analyzes a single branch, so only main is analyzed.
  sonarqube:
    name: SonarQube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, version]
    runs-on: ubuntu-latest
    # SONAR_TOKEN and SONAR_HOST_URL are secrets of the `main` environment,
    # which only jobs that declare it can read.
    environment: main
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for SCM blame and new-code detection

      # The Rust analyzer runs Clippy itself, so it needs cargo and clippy.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The LCOV report holds absolute paths; they match because every
      # ubuntu-latest job checks out to the same workspace directory.
      - uses: actions/download-artifact@v8
        with:
          name: coverage-lcov

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: -Dsonar.projectVersion=${{ needs.version.outputs.version }}

  # When the calculated version differs from the latest tag, a GitHub App bot
  # commits the version bump as `chore(release): vX.Y.Z` and pushes it with
  # the tag. Unlike GITHUB_TOKEN pushes, the App's tag push starts dist's
  # release workflow (release.yml), which builds and publishes the binaries.
  release:
    name: Release
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.version.outputs.version != needs.version.outputs.previous
    needs: [test, version]
    runs-on: ubuntu-latest
    # RELEASE_APP_CLIENT_ID (variable) and RELEASE_APP_PRIVATE_KEY (secret)
    # belong to the `main` environment.
    environment: main
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Commit, tag and push the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # dist only accepts tags that match the package version, and versinc's
          # tag_prefix is the default "v".
          tag="v$VERSION"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "::error title=Release::Tag $tag already exists"
            exit 1
          fi

          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Bump the package version; `cargo update --workspace` only rewrites
          # this package's entry in Cargo.lock.
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          grep -qx "version = \"$VERSION\"" Cargo.toml
          cargo update --workspace
          git diff --stat

          git commit --all --message "chore(release): $tag"
          git tag --annotate "$tag" --message "$tag"
          # Atomic: if main moved since this run started, neither ref is pushed
          # and the next run on main releases instead.
          git push --atomic origin HEAD:main "refs/tags/$tag"
          echo "::notice title=Release::Pushed $tag; release.yml builds and publishes it"
