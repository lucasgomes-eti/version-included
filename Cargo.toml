[package]
name = "version-included"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Calculate the next SemVer version from git commit messages"
license = "Apache-2.0"
repository = "https://github.com/lucasgomes-eti/version-included"
readme = "README.md"

[[bin]]
name = "versinc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
