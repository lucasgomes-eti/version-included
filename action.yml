name: versinc
description: Calculate the next SemVer version from git commit messages
author: Lucas Gomes
branding:
  icon: tag
  color: blue

inputs:
  version:
    description: >-
      The versinc release to install, e.g. "0.2.0" or "latest". Defaults to
      the release this version of the action belongs to.
    required: false
    # The release job in this repository rewrites this line in every
    # `chore(release)` commit, so each tag's default is its own release.
    default: "0.4.0" # x-release-version
  args:
    description: >-
      Extra arguments for versinc, e.g. "--with-prefix --config ci/versinc.toml".
      They are split on whitespace; shell quoting is not supported. Don't pass
      --output: the result is available as the `version` output.
    required: false
    default: ""

outputs:
  version:
    description: >-
      The calculated version, e.g. "1.5.0", or "v1.5.0" when args include
      --with-prefix.
    value: ${{ steps.run.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install versinc
      id: install
      shell: bash
      env:
        VERSINC_VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        fail() {
          echo "::error title=versinc::$1"
          exit 1
        }

        case "$RUNNER_OS_NAME/$RUNNER_ARCH_NAME" in
          Linux/X64) target=x86_64-unknown-linux-musl ;;
          Linux/ARM64) target=aarch64-unknown-linux-musl ;;
          macOS/X64) target=x86_64-apple-darwin ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          *) fail "Unsupported runner: $RUNNER_OS_NAME $RUNNER_ARCH_NAME. versinc runs on Linux and macOS (X64 or ARM64) runners; Windows is not supported." ;;
        esac

        version="${VERSINC_VERSION#v}"
        releases=https://github.com/lucasgomes-eti/version-included/releases
        if [ "$version" = latest ]; then
          url="$releases/latest/download"
        elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          url="$releases/download/v$version"
        else
          fail "Invalid version input: \"$VERSINC_VERSION\". Use a release version such as \"0.2.0\", or \"latest\"."
        fi

        archive="version-included-$target.tar.xz"
        dir="$RUNNER_TEMP/versinc-$version-$target"
        mkdir -p "$dir"
        download() {
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --output "$dir/$1" "$url/$1" \
            || fail "Could not download $url/$1. Check that versinc release $VERSINC_VERSION exists: $releases"
        }
        download "$archive"
        download "$archive.sha256"

        expected=$(awk 'NR == 1 { print $1 }' "$dir/$archive.sha256")
        if command -v sha256sum > /dev/null; then
          actual=$(sha256sum "$dir/$archive" | awk '{ print $1 }')
        else
          actual=$(shasum -a 256 "$dir/$archive" | awk '{ print $1 }')
        fi
        [ "$expected" = "$actual" ] || fail "Checksum mismatch for $archive: expected $expected, got $actual."

        tar -xJf "$dir/$archive" -C "$dir" --strip-components=1
        "$dir/versinc" --version
        echo "$dir" >> "$GITHUB_PATH"
        echo "path=$dir/versinc" >> "$GITHUB_OUTPUT"

    - name: Run versinc
      id: run
      shell: bash
      env:
        VERSINC: ${{ steps.install.outputs.path }}
        VERSINC_ARGS: ${{ inputs.args }}
      run: |
        version_file=$(mktemp "$RUNNER_TEMP/versinc-version.XXXXXX")
        # Split the arguments on whitespace without glob expansion.
        set -f
        # shellcheck disable=SC2086
        "$VERSINC" --output "$version_file" $VERSINC_ARGS
        set +f
        version=$(cat "$version_file")
        echo "version=$version" >> "$GITHUB_OUTPUT"
