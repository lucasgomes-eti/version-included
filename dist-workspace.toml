[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# After each release: test the public GitHub Action against the new binaries,
# and publish the site (GitHub Pages)
post-announce-jobs = ["./action-test", "./site"]
# Deploying to GitHub Pages needs these; a called workflow can't request more
# than its calling job grants
github-custom-job-permissions = { "site" = { contents = "read", pages = "write", id-token = "write" } }

# dist defaults aarch64-apple-darwin to macos-14, which GitHub retired on
# November 2, 2026 (https://github.com/actions/runner-images/issues/13518).
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
