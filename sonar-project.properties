# SonarQube analysis settings, read by the scanner in .github/workflows/ci.yml.
# The project must exist on the server with this key before the first analysis.
sonar.projectKey=version-included
sonar.projectName=version-included

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage produced by `cargo llvm-cov --lcov --output-path lcov.info` in the test job.
sonar.rust.lcov.reportPaths=lcov.info

# Clippy findings: the Rust analyzer runs Clippy itself during the scan
# (sonar.rust.clippy.enabled defaults to true), so no report import is needed.
